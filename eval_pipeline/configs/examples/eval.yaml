# Evaluation configuration for DFQ VLA
# Usage: python -m eval_pipeline.evaluate --config eval_pipeline/configs/examples/eval.yaml

model:
  model_path: "/media/vishal/workspace/projects/VLA/checkpoints/restart_base_model/checkpoint-2311"
  type: "dfq_vla"
  freeze_vision_tower: true
  freeze_llm: true
  freeze_projector: true
  freeze_flex_encoder: true
  freeze_traj_projector: true
  # include_traj_projector: defaults to True

data:
  dataset_path: "/media/vishal/extended_workspace/ar1_coc_dataset/extracted/ar1_hf_dataset_new/"
  data_base_path: "/media/vishal/extended_workspace/ar1_coc_dataset/"
  test_split_ratio: 0.01
  image_size_height: 320
  image_size_width: 512
  dataloader_num_workers: 0
  dataloader_pin_memory: false
  max_len: 1024
  num_history_steps: 16
  num_future_steps: 64
  time_step: 0.1
  num_frames: 4

eval:
  max_new_tokens: 256     # Enough for action reasoning text
  batch_size: 1           # Eval batch size (keep small for memory)
  output_file: "eval_results.json"

# LoRA adapter checkpoint (if applicable)
checkpoint_path: ""

lora:
  enabled: true
  r: 64
  lora_alpha: 128
  expand_target_modules: true
  llm_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  vision_enc_target_modules: []
  modules_to_save:
    - "flex_scene_encoder"
    - "projector"
    - "lm_head"
    - "embed_tokens"
