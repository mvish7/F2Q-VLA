model:
  model_path: "/media/vishal/workspace/projects/VLA/checkpoints/restart_base_model_3/checkpoint-2500"
  type: "dfq_vla"
  freeze_vision_tower: true
  freeze_llm: true
  freeze_projector: false
  freeze_action_head: false
  freeze_traj_projector: true
  include_action_head: false
  include_traj_projector: false
  include_vqvae: false
  loss_weights:
    text: 1.0
    xyz: 0.001
    rot: 0.001
  scheduled_sampling_prob: 0.0
  action_head_grad_scale: 0.0

data:
  dataset_path: "/media/vishal/datasets/ar1_coc_dataset/extracted/ar1_hf_dataset_new/"
  data_base_path: "/media/vishal/datasets/ar1_coc_dataset/"
  test_split_ratio: 0.01
  image_size_height: 320
  image_size_width: 512
  dataloader_num_workers: 12
  dataloader_pin_memory: true
  dataloader_prefetch_factor: 2
  max_len: 1024
  num_history_steps: 16
  num_future_steps: 64
  time_step: 0.1
  num_frames: 4
  traj_history_dropout_prob: 0.8  # Prob of zeroing out traj history per sample

training:
  output_dir: "/media/vishal/workspace/projects/VLA/checkpoints/restart_base_model_4/"
  num_train_epochs: 1
  learning_rate: 1.0e-3
  llm_learning_rate: 2.0e-5
  weight_decay: 0.01
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 16
  report_to: "tensorboard"
  save_steps: 250
  logging_steps: 10
  use_liger_kernel: true
  torch_empty_cache_steps: 1
  optim: "adamw_bnb_8bit"  # Options: adamw_bnb_8bit, adamw_torch, muon_plus_adamw
  gradient_checkpointing: true
  bf16: false
  torch_compile: true
  torch_compile_backend: "inductor"
  torch_compile_mode: "default"
  lr_scheduler_type: "cosine_with_restarts"
  lr_scheduler_kwargs:
    num_cycles: 2  # Number of hard restarts for cosine_with_restarts scheduler
  warmup_ratio: 0.03  # Fraction of total steps used for linear warmup
  resume_from_checkpoint: ""

qlora:
  enabled: false
  load_in_4bit: false
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: true

lora:
  enabled: true
  r: 64
  lora_alpha: 128
  expand_target_modules: true
  llm_target_modules: []
  modules_to_save:
    - "flex_scene_encoder"
    - "projector"
    - "lm_head"
    - "embed_tokens"

  # ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  #     - "traj_projector"