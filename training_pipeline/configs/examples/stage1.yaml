model:
  model_path: "/media/vishal/workspace/projects/VLA/dfq_vla_artifacts"
  type: "dfq_vla"
  freeze_vision_tower: true
  freeze_llm: false
  freeze_projector: false
  freeze_action_head: false
  include_action_head: false
  include_vqvae: false
  loss_weights:
    text: 1.0
    xyz: 0.001
    rot: 0.001
  scheduled_sampling_prob: 0.0
  action_head_grad_scale: 0.0

data:
  dataset_path: "/media/vishal/datasets/ar1_coc_dataset/extracted/ar1_hf_dataset_new/"
  data_base_path: "/media/vishal/datasets/ar1_coc_dataset/"
  test_split_ratio: 0.01
  image_size_height: 320
  image_size_width: 512
  dataloader_num_workers: 12
  dataloader_pin_memory: true
  dataloader_prefetch_factor: 2
  max_len: 1024
  num_history_steps: 16
  num_future_steps: 64
  time_step: 0.1
  num_frames: 4

training:
  output_dir: "/media/vishal/workspace/projects/VLA/checkpoints/dfq_stage1_1"
  num_train_epochs: 1
  learning_rate: 1.0e-3
  weight_decay: 0.01
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 16
  report_to: "tensorboard"
  save_steps: 250
  logging_steps: 10
  use_liger_kernel: true
  torch_empty_cache_steps: 1
  optim: "adamw_bnb_8bit"
  gradient_checkpointing: true
  bf16: false
  torch_compile: true
  torch_compile_backend: "inductor"
  torch_compile_mode: "default"
  "resume_from_checkpoint": "/media/vishal/workspace/projects/VLA/checkpoints/dfq_stage1/checkpoint-1500/"

qlora:
  enabled: false
  load_in_4bit: false
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: true

lora:
  enabled: true
  r: 64
  lora_alpha: 128
  expand_target_modules: true
  llm_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  modules_to_save:
    - "flex_scene_encoder"
    - "projector"
    - "traj_projector"
    - "lm_head"
    - "embed_tokens"
