model:
  model_path: "/media/vishal/workspace/projects/VLA/dfq_vla_artifacts"
  type: "dfq_vla"
  freeze_vision_tower: true
  freeze_llm: true
  freeze_projector: false
  freeze_action_head: false
  loss_weights:
    text: 1.0
    xyz: 1.0
    rot: 1.0

data:
  dataset_path: "/media/vishal/datasets/ar1_coc_dataset/extracted/ar1_hf_with_coc_reasoning4/"
  image_base_path: "/media/vishal/datasets/ar1_coc_dataset/extracted/"
  test_split_ratio: 0.01
  image_size_height: 320
  image_size_width: 512
  dataloader_num_workers: 1  # Use main process to avoid memory fragmentation from prefetching
  dataloader_pin_memory: true  # Disable pin_memory to save GPU memory
  dataloader_prefetch_factor: 1

training:
  output_dir: "/media/vishal/workspace/projects/VLA/checkpoints/dfq_with_dino_testing"
  num_train_epochs: 50
  learning_rate: 1.0e-5
  weight_decay: 0.01
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 16
  report_to: "tensorboard"
  save_steps: 500
  logging_steps: 3
  use_liger_kernel: true
  torch_empty_cache_steps: 1
  optim: "adamw_bnb_8bit"
  gradient_checkpointing: true  # Recommended for QLoRA
  bf16: false  # Disable autocast, rely on native bfloat16 from the model/QLoRA config

# QLoRA: 4-bit quantization configuration
qlora:
  enabled: false
  load_in_4bit: false
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: true

# LoRA adapters (required when using QLoRA)
lora:
  enabled: true
  r: 64
  lora_alpha: 128
  target_modules:
    # Regex patterns (PEFT uses re.fullmatch). Anchored to language_model/vision_tower
    # so action_head and flex_scene_encoder sub-modules are never matched.
    # LLM layers
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
    - "embed_tokens"
    - "lm_head"

  modules_to_save:
    - "flex_scene_encoder"
    - "action_head"
    - "projector"

